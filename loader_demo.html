<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed Razin | Portfolio Loader</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --matrix-green: #00ff41;
    --matrix-dim: #003b00;
    --matrix-mid: #00a312;
    --matrix-glow: rgba(0,255,65,0.4);
    --black: #0a0a0a;
    --dark: #0d0d0d;
    --panel: rgba(0,255,65,0.04);
    --border: rgba(0,255,65,0.2);
    --text: #ffffff;
    --text-dim: #8c8c8c;
    --cyan: #00e5ff;
    --cyan-dim: rgba(0,229,255,0.12);
    --cyan-glow: rgba(0,229,255,0.35);
    --cyan-mid: rgba(0,229,255,0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--matrix-green);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── CINEMATIC BOOT SCREEN ── */
  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 1s ease, visibility 1s ease;
    cursor: none;
  }
  #loader * {
    cursor: none;
  }

  /* Sniper Custom Cursor */
  #custom-cursor {
    position: fixed;
    width: 36px;
    height: 36px;
    pointer-events: none;
    z-index: 100000;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Central dot */
  .crosshair-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    background: var(--matrix-green);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px var(--matrix-green);
    transition: background 0.2s, box-shadow 0.2s;
  }

  /* Outer crosshair ring */
  .crosshair-ring {
    position: absolute;
    inset: 0;
    border: 1px solid var(--matrix-green);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(0, 255, 65, 0.35);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  }

  /* Outer ticks */
  .crosshair-tick {
    position: absolute;
    background: var(--matrix-green);
    box-shadow: 0 0 4px var(--matrix-green);
    transition: background 0.2s, box-shadow 0.2s;
  }

  .crosshair-tick.t {
    top: -4px; left: 50%;
    width: 1px; height: 6px;
    transform: translateX(-50%);
  }

  .crosshair-tick.b {
    bottom: -4px; left: 50%;
    width: 1px; height: 6px;
    transform: translateX(-50%);
  }

  .crosshair-tick.l {
    left: -4px; top: 50%;
    width: 6px; height: 1px;
    transform: translateY(-50%);
  }

  .crosshair-tick.r {
    right: -4px; top: 50%;
    width: 6px; height: 1px;
    transform: translateY(-50%);
  }

  /* Target lock-on hover effects */
  #custom-cursor.lock-on {
    transform: translate(-50%, -50%) rotate(45deg) scale(1.15);
  }

  #custom-cursor.lock-on .crosshair-ring {
    border-color: #ff3333;
    box-shadow: 0 0 12px rgba(255, 51, 51, 0.7);
  }

  #custom-cursor.lock-on .crosshair-dot,
  #custom-cursor.lock-on .crosshair-tick {
    background: #ff3333;
    box-shadow: 0 0 6px #ff3333;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #decrypt-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .loader-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.9) 100%);
    z-index: 2;
    pointer-events: none;
  }

  .loader-scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    z-index: 3;
    pointer-events: none;
    animation: scanroll 8s linear infinite;
  }

  @keyframes scanroll {
    0%   { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  /* Decryption Instructions Hint */
  .decrypt-instruction {
    position: absolute;
    top: 30px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 3px;
    color: #ff5555;
    text-transform: uppercase;
    z-index: 10;
    text-shadow: 0 0 8px rgba(255, 85, 85, 0.4);
    animation: flash-pulse 2s infinite;
  }

  @keyframes flash-pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Center HUD Layout */
  .hud-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* Round Loading Container around Name */
  .name-ring-container {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.85);
    border-radius: 50%;
    box-shadow: inset 0 0 30px rgba(0, 255, 65, 0.05);
    backdrop-filter: blur(8px);
  }

  .name-progress-svg {
    position: absolute;
    width: 320px;
    height: 320px;
    transform: rotate(-90deg);
  }

  .name-progress-svg circle {
    fill: none;
    stroke-width: 4px;
  }

  .name-progress-svg .track {
    stroke: rgba(0, 255, 65, 0.04);
  }

  .name-progress-svg .fill {
    stroke: var(--matrix-green);
    stroke-dasharray: 911;
    stroke-dashoffset: 911;
    transition: stroke-dashoffset 0.12s linear;
    filter: drop-shadow(0 0 8px var(--matrix-green));
  }

  /* ── Continuous Electric Name Glitch ── */
  .electric-name {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.3rem, 3.2vw, 2.1rem);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 2px;
    color: var(--matrix-green);
    text-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
    position: relative;
    text-align: center;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }

  .electric-name::before,
  .electric-name::after {
    content: "MOHAMMED\A RAZIN H";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    white-space: pre-wrap;
  }

  .electric-name::before {
    left: 2px;
    text-shadow: -2px 0 #ff00c1;
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim-1 1s infinite linear alternate-reverse;
  }

  .electric-name::after {
    left: -2px;
    text-shadow: -2px 0 #00e5ff;
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim-2 1s infinite linear alternate-reverse;
  }

  @keyframes glitch-anim-1 {
    0% { clip: rect(10px, 9999px, 30px, 0); }
    10% { clip: rect(85px, 9999px, 5px, 0); }
    20% { clip: rect(42px, 9999px, 73px, 0); }
    30% { clip: rect(95px, 9999px, 12px, 0); }
    40% { clip: rect(3px, 9999px, 92px, 0); }
    50% { clip: rect(78px, 9999px, 55px, 0); }
    60% { clip: rect(25px, 9999px, 85px, 0); }
    70% { clip: rect(54px, 9999px, 34px, 0); }
    80% { clip: rect(90px, 9999px, 60px, 0); }
    90% { clip: rect(15px, 9999px, 80px, 0); }
    100% { clip: rect(62px, 9999px, 20px, 0); }
  }

  @keyframes glitch-anim-2 {
    0% { clip: rect(65px, 9999px, 15px, 0); }
    10% { clip: rect(5px, 9999px, 85px, 0); }
    20% { clip: rect(92px, 9999px, 20px, 0); }
    30% { clip: rect(12px, 9999px, 95px, 0); }
    40% { clip: rect(82px, 9999px, 5px, 0); }
    50% { clip: rect(55px, 9999px, 78px, 0); }
    60% { clip: rect(85px, 9999px, 25px, 0); }
    70% { clip: rect(34px, 9999px, 54px, 0); }
    80% { clip: rect(60px, 9999px, 90px, 0); }
    90% { clip: rect(80px, 9999px, 15px, 0); }
    100% { clip: rect(20px, 9999px, 62px, 0); }
  }

  /* Status and Progress percentage */
  .status-row {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .glow-percent {
    font-size: 1rem;
    font-weight: bold;
    text-shadow: 0 0 10px var(--matrix-green);
    letter-spacing: 2px;
  }

  /* Action Buttons */
  .enter-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 18px 28px;
    border: 1px solid rgba(0, 255, 65, 0.4);
    background: rgba(0, 255, 65, 0.02);
    color: var(--matrix-green);
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.05);
    transition: all 0.3s ease;
    margin-top: 20px;
    opacity: 0;
    pointer-events: none;
    width: 280px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .enter-btn.show {
    opacity: 1;
    pointer-events: all;
    animation: btn-pulse 2s infinite ease-in-out;
  }

  /* Rolling scanlines inside the button */
  .enter-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0, 255, 65, 0.04), rgba(0, 255, 65, 0.04) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 2;
  }

  @keyframes btn-pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 65, 0.1), inset 0 0 8px rgba(0, 255, 65, 0.03); border-color: rgba(0, 255, 65, 0.4); }
    50% { box-shadow: 0 0 25px rgba(0, 255, 65, 0.3), inset 0 0 15px rgba(0, 255, 65, 0.1); border-color: rgba(0, 255, 65, 0.85); }
  }

  /* Cyber brackets on the button */
  .btn-bracket {
    position: absolute;
    width: 6px;
    height: 6px;
    border-color: var(--matrix-green);
    border-style: solid;
    transition: all 0.3s ease;
    z-index: 5;
  }
  .btn-bracket.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .btn-bracket.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .btn-bracket.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .btn-bracket.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  /* Moving laser beam across the button on hover */
  .btn-scanner {
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.2), transparent);
    transition: all 0.5s ease;
    pointer-events: none;
    z-index: 3;
  }

  /* Small status code on top left */
  .btn-status-sub {
    position: absolute;
    top: 3px;
    left: 8px;
    font-size: 0.45rem;
    color: rgba(0, 255, 65, 0.45);
    letter-spacing: 1px;
    pointer-events: none;
    font-family: 'Share Tech Mono', monospace;
    z-index: 5;
  }

  .enter-btn:hover {
    background: rgba(0, 255, 65, 0.15);
    border-color: var(--matrix-green);
    color: #fff;
    box-shadow: 0 0 35px rgba(0, 255, 65, 0.45);
    animation: btn-glitch-text 0.15s steps(2, start) infinite;
  }

  @keyframes btn-glitch-text {
    0% { text-shadow: 2px 0 #ff00c1, -2px 0 #00e5ff; }
    50% { text-shadow: -2px 0 #ff00c1, 2px 0 #00e5ff; }
    100% { text-shadow: 2px 0 #ff00c1, -2px 0 #00e5ff; }
  }

  .enter-btn:hover .btn-scanner {
    left: 150%;
    transition: left 0.8s ease-in-out;
  }

  .enter-btn:hover .btn-bracket.tl { top: 3px; left: 3px; }
  .enter-btn:hover .btn-bracket.tr { top: 3px; right: 3px; }
  .enter-btn:hover .btn-bracket.bl { bottom: 3px; left: 3px; }
  .enter-btn:hover .btn-bracket.br { bottom: 3px; right: 3px; }

  /* Screen shake glitch transition */
  .screen-glitch {
    animation: screen-shake 0.4s linear;
  }

  @keyframes screen-shake {
    0%, 100% { transform: translate(0, 0) skew(0deg); }
    20% { transform: translate(-4px, 3px) skew(-1.5deg); filter: hue-rotate(45deg) saturate(1.5); }
    40% { transform: translate(4px, -2px) skew(1.5deg); }
    60% { transform: translate(-3px, -3px) skew(0deg); filter: hue-rotate(-45deg) contrast(1.2); }
    80% { transform: translate(3px, 4px) skew(2.5deg); }
  }
</style>
</head>
<body>

<!-- CINEMATIC BOOT SCREEN -->
<div id="loader">
  <!-- Sniper Crosshair Custom Cursor -->
  <div id="custom-cursor">
    <div class="crosshair-dot"></div>
    <div class="crosshair-ring"></div>
    <div class="crosshair-tick t"></div>
    <div class="crosshair-tick b"></div>
    <div class="crosshair-tick l"></div>
    <div class="crosshair-tick r"></div>
  </div>

  <canvas id="decrypt-canvas"></canvas>
  <div class="loader-vignette"></div>
  <div class="loader-scanlines"></div>

  <div class="hud-center">
    <!-- Round Loading around Name -->
    <div class="name-ring-container">
      <svg class="name-progress-svg" viewBox="0 0 320 320">
        <circle class="track" cx="160" cy="160" r="145" />
        <circle class="fill" id="circular-bar" cx="160" cy="160" r="145" stroke-dasharray="911" stroke-dashoffset="911" />
      </svg>
      <div class="electric-name">MOHAMMED<br>RAZIN H</div>
    </div>
    
    <div class="status-row">
      <span class="glow-percent" id="loader-percent">0%</span>
    </div>
    
    <button class="enter-btn" id="enter-btn" onclick="enterPortfolio()">
      <span class="btn-bracket tl"></span>
      <span class="btn-bracket tr"></span>
      <span class="btn-bracket bl"></span>
      <span class="btn-bracket br"></span>
      <span class="btn-scanner"></span>
      <span class="btn-status-sub">SYS_BOOT: READY</span>
      ACCESS PORTFOLIO
    </button>
  </div>
</div>

<div style="text-align: center; color: white; padding-top: 150px;">
  <h2 style="font-family:'Orbitron',sans-serif; letter-spacing: 2px;">PORTFOLIO MAIN SCREEN (SIMULATED)</h2>
  <p style="color: var(--matrix-green); margin-top: 20px;">You have successfully entered the portfolio!</p>
  <button onclick="location.reload()" style="background: transparent; border: 1px solid var(--matrix-green); color: var(--matrix-green); padding: 10px 20px; font-family: inherit; margin-top: 30px; cursor: pointer;">Reload Boot Loader</button>
</div>

<!-- Decryptor canvas logic -->
<script>
  (function() {
    const canvas = document.getElementById('decrypt-canvas');
    const ctx = canvas.getContext('2d');
    let animId = null;
    
    const rows = 24;
    const cols = 40;
    
    let mouseX = -9999, mouseY = -9999;
    let chargeProgress = 0;
    let particles = [];

    // Click particle burst trigger
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: clickX,
          y: clickY,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.03,
          char: Math.random() > 0.5 ? "1" : "0",
          color: Math.random() > 0.3 ? 'rgba(0, 255, 65, 0.9)' : 'rgba(255, 255, 255, 0.9)'
        });
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchstart', (e) => {
      const rect = canvas.getBoundingClientRect();
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX - rect.left;
        mouseY = e.touches[0].clientY - rect.top;
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX - rect.left;
        mouseY = e.touches[0].clientY - rect.top;
      }
    });

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }

    const secretMessages = [
      "MOHAMMED RAZIN H - PORTFOLIO DATABASE ACCESS AUTHORISED",
      "CORE SPECIALIZATION: DATA ANALYSIS & AI BUILDING",
      "LEETCODE INDEX: 1750+ SOLVED [TOP 5% IN ACCURACY]",
      "V-CONNECT SYSTEM: 650K+ RECORDS ETL VALIDATED",
      "LOGISENSE DASHBOARD: INFERENCE METRICS NOMINAL"
    ];

    function drawDecryptor() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const charW = canvas.width / cols;
      const charH = canvas.height / rows;
      
      ctx.font = '10px Share Tech Mono';
      
      for(let r = 0; r < rows; r++) {
        for(let c = 0; c < cols; c++) {
          const cellX = c * charW + charW/2;
          const cellY = r * charH + charH/2;
          
          const dx = mouseX - cellX;
          const dy = mouseY - cellY;
          const dist = Math.sqrt(dx*dx + dy*dy);
          
          let character = "";
          let fillStyle = "";
          
          if (dist < 130) {
            fillStyle = '#00ff41';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#00ff41';
            
            const msgIndex = Math.min(secretMessages.length - 1, Math.floor(r / (rows / secretMessages.length)));
            const msg = secretMessages[msgIndex];
            const startCol = Math.floor((cols - msg.length) / 2);
            
            if (c >= startCol && c < startCol + msg.length) {
              character = msg[c - startCol];
              fillStyle = '#ffffff';
              ctx.shadowColor = '#ffffff';
            } else {
              character = Math.random() > 0.5 ? "1" : "0";
            }
          } else {
            fillStyle = 'rgba(0, 163, 18, 0.1)';
            ctx.shadowBlur = 0;
            const hexChars = "0123456789ABCDEF";
            character = hexChars[Math.floor(Math.random() * hexChars.length)];
          }
          
          ctx.fillStyle = fillStyle;
          ctx.fillText(character, cellX - 4, cellY + 4);
        }
      }
      
      // Draw and animate click particle explosions
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.font = '11px Share Tech Mono';
        ctx.fillText(p.char, p.x - 4, p.y + 4);
      }
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 0;

      animId = requestAnimationFrame(drawDecryptor);
    }

    let startTime = null;
    const duration = 12000; // 12 seconds

    function animateProgress(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const progress = Math.min(100, (elapsed / duration) * 100);
      const roundedVal = Math.floor(progress);

      const circularBar = document.getElementById('circular-bar');
      const pct = document.getElementById('loader-percent');
      const btn = document.getElementById('enter-btn');

      if (circularBar) {
        const offset = 911 - (911 * roundedVal / 100);
        circularBar.style.strokeDashoffset = offset;
      }
      if (pct) {
        pct.textContent = `${roundedVal}%`;
      }

      if (progress < 100) {
        requestAnimationFrame(animateProgress);
      } else {
        if (btn) btn.classList.add('show');
      }
    }

    window.startDecryptor = function() {
      resize();
      startTime = null;
      requestAnimationFrame(animateProgress);
      if (!animId) drawDecryptor();
    };
    
    window.addEventListener('resize', resize);
    window.startDecryptor();
  })();

  function enterPortfolio() {
    const loader = document.getElementById('loader');
    loader.classList.add('screen-glitch');
    
    setTimeout(() => {
      loader.classList.add('hidden');
      document.body.style.overflow = '';
    }, 400);
  }

  document.body.style.overflow = 'hidden';

  // Sniper Crosshair cursor tracking
  (function() {
    const cursor = document.getElementById('custom-cursor');
    const enterBtn = document.getElementById('enter-btn');
    
    window.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      cursor.style.opacity = '1';
    });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        cursor.style.left = e.touches[0].clientX + 'px';
        cursor.style.top = e.touches[0].clientY + 'px';
        cursor.style.opacity = '1';
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        cursor.style.left = e.touches[0].clientX + 'px';
        cursor.style.top = e.touches[0].clientY + 'px';
        cursor.style.opacity = '1';
      }
    });

    document.addEventListener('mouseleave', () => {
      cursor.style.opacity = '0';
    });

    // Active lock-on target trigger when hovering the action button
    enterBtn.addEventListener('mouseenter', () => {
      cursor.classList.add('lock-on');
    });
    enterBtn.addEventListener('mouseleave', () => {
      cursor.classList.remove('lock-on');
    });
  })();
</script>

</body>
</html>
