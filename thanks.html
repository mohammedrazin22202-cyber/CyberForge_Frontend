<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THANK YOU // TRANSMISSION COMPLETE</title>
<link rel="icon" type="image/png" href="cyberforge_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --green-border: rgba(0, 255, 136, 0.25);
    --bg-dark: #020704;
    --bg-card: rgba(4, 15, 8, 0.7);
    --text-main: #e0f2e9;
    --text-muted: #88a395;
    --cyan: #00e5ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  /* FIXED: Use max-width and percentage width for mobile responsiveness */
  .thanks-card {
    width: 100%;
    max-width: 580px;
    background: var(--bg-card);
    border: 1px solid var(--green-border);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  }
  .thanks-card::before {
    content: '';
    position: absolute;
    top: -1px; left: 10%; right: 10%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), var(--cyan), transparent);
  }
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--cyan);
    margin-bottom: 12px;
  }
  .desc {
    font-size: 1.1rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  /* FIXED: Buttons wrap on small devices */
  .button-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(0, 255, 136, 0.03);
    border: 1px solid var(--green-border);
    color: var(--green);
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 6px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }
  .btn:hover {
    background: rgba(0, 255, 136, 0.08);
    border-color: var(--green);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.12);
    color: #ffffff;
    transform: translateY(-2px);
  }
  .btn .key-hint {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .btn:hover .key-hint {
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
  }
  
  .btn.danger {
    background: rgba(255, 51, 102, 0.03);
    border-color: rgba(255, 51, 102, 0.25);
    color: var(--red);
  }

  .btn.danger:hover {
    background: rgba(255, 51, 102, 0.08);
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255, 51, 102, 0.12);
    color: #ffffff;
  }
  
  @media (max-width: 480px) {
    .title { font-size: 1.8rem; }
    .desc { font-size: 1rem; }
    .thanks-card { padding: 30px 20px; }
    .button-group { flex-direction: column; width: 100%; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
  <div class="error-card thanks-card">
    <h1 class="title">TRANSMISSION COMPLETE</h1>
    <p class="desc">
      Thank you for visiting CyberForge. Your session log has been securely saved.
    </p>
    <div class="button-group">
      <a href="/" class="btn primary">
        <span>Return to Home</span>
        <span class="key-hint">H</span>
      </a>
      <a href="/chatbot" class="btn">
        <span>Query Chatbot</span>
        <span class="key-hint">C</span>
      </a>
      <div class="btn danger" id="btn-exit">
        <span>Exit System</span>
        <span class="key-hint">ESC</span>
      </div>
    </div>
  </div>

  <script>
    // Strict check to prevent direct access to 404.html without an actual error
    if (window.location.pathname.endsWith('/404.html') || window.location.pathname.endsWith('/404')) {
      window.location.replace('/');
    }

    const exitFn = () => {
      window.close();
      // Fallback if browser blocks window.close()
      setTimeout(() => {
        const card = document.querySelector('.error-card');
        card.innerHTML = `
          <div class="error-code" style="background: linear-gradient(135deg, #ffffff 30%, var(--red) 70%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">OFFLINE</div>
          <div class="error-title" style="color: var(--red); margin-top: 10px; margin-bottom: 20px;">Session Terminated</div>
          <div class="error-desc" style="font-family: 'Share Tech Mono', monospace; font-size: 1.05rem; line-height: 1.8; text-align: left; background: rgba(1, 6, 3, 0.9); border: 1px solid rgba(255, 51, 102, 0.15); border-radius: 6px; padding: 20px; color: var(--text-muted);">
            >> CONNECTION SEVERED.<br>
            >> CORE SHUTDOWN SEQUENCE COMPLETED.<br>
            >> SAFE TO CLOSE THIS BROWSER TAB.
          </div>
          <div style="margin-top: 30px;">
            <a href="/" class="btn primary" style="justify-content: center; width: 100%;">Reconnect to System</a>
          </div>
        `;
      }, 100);
    };

    document.getElementById('btn-exit').addEventListener('click', exitFn);

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'h') {
        window.location.href = '/';
      } else if (key === 'c') {
        window.location.href = '/chatbot';
      } else if (e.key === 'Escape') {
        exitFn();
      }
    });
  </script>
</body>
</html>
